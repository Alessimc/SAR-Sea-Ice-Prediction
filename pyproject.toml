[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sar-sea-ice-prediction"
version = "0.1.0"
description = "U-Net sea ice drift prediction from Sentinel-1 SAR + CARRA reanalysis wind"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "rioxarray",
    "rasterio",
    "pyproj",
    "affine",
    "sentinelhub",
    "requests",
    "requests-oauthlib",
    "oauthlib",
    "shapely",
    "h5py",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "model_dev_main*", "AROME_datahandling*", "test_baselines*", "variation_in_wind_drift_relation*"]
